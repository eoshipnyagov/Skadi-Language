          - Обзор репозитория: internal/project-overview.md
          - Техсправочник проекта: internal/project-tech-reference.md
          - Служебная справка CLI: internal/cli-usage.md
          - Границы Skadi -> C: internal/to-c-scope.md
          - Покрытие тестами: internal/test-coverage.md
          - Стиль диагностики: internal/diagnostics-style.md
          - Справочник кодов диагностики: internal/diagnostic-codes.md
          - Матрица токенов и конструкций: internal/token-construct-coverage.md
          - Scope и видимость v1.1: internal/scope-visibility.md
          - Сайт документации и i18n: internal/docs-site-and-i18n.md
      - Контракты и стиль v1:
