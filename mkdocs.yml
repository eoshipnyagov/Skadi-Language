site_name: Skadi Docs
site_description: Skadi language and tooling documentation
site_url: https://eoshipnyagov.github.io/Skadi-Language/
repo_url: https://github.com/eoshipnyagov/Skadi-Language
repo_name: Skadi
docs_dir: .docs-build
site_dir: site
use_directory_urls: false

theme:
  name: material
  language: ru
  font:
    text: Noto Sans
    code: JetBrains Mono
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy

plugins:
  - search
  - i18n:
      docs_structure: suffix
      languages:
        - locale: ru
          name: Русский
          default: true
          build: true
          link: /
        - locale: en
          name: English
          build: true
          link: /en/
          nav_translations:
            Главная: Home
            Пользовательские документы: User Docs
            Внутренние документы: Internal Docs
            Старт: Start
            Инструменты: Tooling
            Язык: Language
            Основы языка: Language Basics
            Systems surface: Systems Surface
            Платформы и будущее: Platforms and Future
            Примеры и автоматизация: Examples and Automation
            Обзор: Overview
            Установка: Installation
            Переход с v1.1 на v1.2: Migrating from v1.1 to v1.2
            Быстрый старт: Quick Start
            Быстрый старт CLI: CLI Quick Start
            Справочник CLI/TUI: CLI/TUI Reference
            Быстрая справка: Quick Reference
            Полная справка: Complete Reference
            Типы, литералы и выражения: Types, Literals, and Expressions
            Ветвления и циклы: Control Flow
            Функции и ошибки: Functions and Errors
            Struct, Text и List: Struct, Text, and List
            Модули и видимость: Modules and Visibility
            Ввод, вывод и файлы: I/O and Files
            Математика: Math
            Управление памятью: Memory
            Владение и передача ресурсов: Ownership and Resource Transfer
            Практики и антипримеры: Practices and Anti-patterns
            Короткие примеры: Short Examples
            Время и длительности: Time and Duration
            Размеры памяти: Byte Sizes
            Углы: Angles
            Векторы: Vectors
            Целые и биты: Integers and Bits
            Многопоточность: Concurrency
            Embedded: Embedded
            Canvas и Visual Core: Canvas and Visual Core
            Статус синтаксиса: Syntax Status
            Skadi для AI и vibe coding: Skadi for AI and vibe coding
            Showcase-программы: Showcase Programs
            Текущий компилятор: Current Compiler
            Аудит документации: Documentation Audit
            Обзор репозитория: Repository Overview
            Служебная справка CLI: Internal CLI Usage
            Исторический RFC CLI: Historical CLI RFC
            Контракты и стиль v1: v1 Contracts and Style
            Планы и блокеры: Plans and Blockers
            Будущие треки: Future Tracks
            Техсправочник проекта: Project Tech Reference
            Границы Skadi -> C: Skadi -> C Scope
            Покрытие тестами: Test Coverage
            Стиль диагностики: Diagnostics Style
            Справочник кодов диагностики: Diagnostic Codes Reference
            Матрица токенов и конструкций: Token and Construct Matrix
            Scope и видимость v1.1: v1.1 Scope and Visibility
            Что не поддерживается в v1: v1 Non-Goals
            План реализации: Implementation Plan
            План v1.1: v1.1 Plan
            Закрытие roadmap v1.1: v1.1 Roadmap Close-out
            План v1.2: v1.2 Plan
            Стилевые принципы: Style Principles
            Каноническая матрица синтаксиса: Canonical Syntax Matrix
            Контракт Text v1: Text v1 Contract
            Матрица on error v1: on error v1 Matrix
            Контракт runtime memory v1: Runtime Memory v1 Contract
            Блокеры v1: v1 Blockers
            Сайт документации и i18n: Docs Site and i18n
            Memory: Memory
            Примеры и антипримеры: Examples and Negative Cases
            Task / Concurrency: Task / Concurrency
            Visual Core: Visual Core
            Systems Additions: Systems Additions
            Draft: Draft
            MVP Contract: MVP Contract
            Runtime MVP Design: Runtime MVP Design

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - tables
  - pymdownx.highlight:
      anchor_linenums: false
      use_pygments: true
      pygments_lang_class: true
  - pymdownx.superfences
  - toc:
      permalink: true

extra_css:
  - assets/extra.css

nav:
  - Главная: index.md
  - Пользовательские документы:
      - Обзор: user/index.md
      - Старт:
          - Быстрый старт: user/getting-started.md
          - Установка: user/installation.md
          - Переход с v1.1 на v1.2: user/v1-2-migration.md
      - Инструменты:
          - Справочник CLI/TUI: user/cli-reference.md
          - Быстрый старт CLI: user/cli-quick-start.md
      - Язык:
          - Быстрая справка: user/language-quick-reference.md
          - Полная справка: user/language-reference.md
          - Основы языка:
              - Типы, литералы и выражения: user/language-basics.md
              - Ветвления и циклы: user/control-flow.md
              - Функции и ошибки: user/functions-errors.md
              - Struct, Text и List: user/data-model.md
              - Модули и видимость: user/modules.md
              - Ввод, вывод и файлы: user/io-files.md
              - Математика: user/math.md
          - Systems surface:
              - Управление памятью: user/memory.md
              - Владение и передача ресурсов: user/ownership.md
              - Многопоточность: user/concurrency.md
              - Время и длительности: user/time-duration.md
              - Размеры памяти: user/byte-size.md
              - Углы: user/angle.md
              - Векторы: user/vectors.md
              - Целые и биты: user/bits.md
          - Практики и антипримеры: user/practices.md
          - Статус синтаксиса: user/syntax-status.md
      - Платформы и будущее:
          - Embedded: user/embedded.md
          - Canvas и Visual Core: user/canvas.md
      - Примеры и автоматизация:
          - Короткие примеры: user/language-examples.md
          - Showcase-программы: user/showcases.md
          - Skadi для AI и vibe coding: user/ai-guide.md
  - Внутренние документы:
