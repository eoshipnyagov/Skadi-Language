              - MVP Contract: internal/task-model-mvp.md
              - Runtime MVP Design: internal/task-runtime-mvp-design.md
          - Accepted Systems Contracts:
              - Tag and Label: internal/tag-label-contract.md
              - Channel Lifecycle: internal/channel-lifecycle-contract.md
              - Borrow Access and Resources: internal/direct-borrow-resource-contract.md
              - Ownership UX Lab: internal/ownership-ux-lab.md
              - Interrupt Model: internal/interrupt-model-contract.md
          - Visual Core:
