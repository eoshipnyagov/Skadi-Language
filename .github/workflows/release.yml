name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release version (with or without v prefix)
        required: true
        default: 1.2.0-rc.1
      publish:
        description: Create a draft GitHub prerelease (the matching tag must exist)
        required: true
        type: boolean
        default: false
  push:
    tags:
      - "v*"

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  NO_MKDOCS_2_WARNING: "1"

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Resolve release version
        id: version
        shell: bash
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            version="${GITHUB_REF_NAME#v}"
          else
            version="${INPUT_VERSION#v}"
          fi
          python scripts/release/package_release.py verify-version --version "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-docs.txt

      - name: Install documentation dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-docs.txt

      - name: Run release quality gates
        shell: bash
        run: |
          cargo fmt --all --check
          cargo clippy --workspace --all-targets -- -D warnings
          cargo test --workspace --locked -- --skip e2e_
          python -m unittest scripts/release/test_package_release.py -v
          python scripts/check_docs_consistency.py
          python scripts/sync_docs_site.py
          python -m mkdocs build --strict

  build-packages:
    needs: validate
    name: Package ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-2025-vs2026
            target: x86_64-pc-windows-msvc
            binary: target/x86_64-pc-windows-msvc/release/skadi-cli.exe
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-musl
            binary: target/x86_64-unknown-linux-musl/release/skadi-cli
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
            binary: target/aarch64-unknown-linux-musl/release/skadi-cli
          - runner: macos-15-intel
            target: x86_64-apple-darwin
            binary: target/x86_64-apple-darwin/release/skadi-cli
          - runner: macos-15
            target: aarch64-apple-darwin
            binary: target/aarch64-apple-darwin/release/skadi-cli
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Rust target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install musl linker
        if: contains(matrix.target, 'linux-musl')
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools
          linker_key="CARGO_TARGET_$(echo '${{ matrix.target }}' | tr '[:lower:]-' '[:upper:]_')_LINKER"
          echo "$linker_key=musl-gcc" >> "$GITHUB_ENV"

      - name: Build release binary
        run: cargo build --release --locked -p skadi-cli --target ${{ matrix.target }}

      - name: Build deterministic archive
        shell: bash
        run: |
          python scripts/release/package_release.py package \
            --binary '${{ matrix.binary }}' \
            --target '${{ matrix.target }}' \
            --version '${{ needs.validate.outputs.version }}' \
            --output-dir dist

      - name: Upload target archive
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.target }}
          path: dist/skadi-cli-*
          if-no-files-found: error
          retention-days: 14

  distribution-smoke:
    needs: [validate, build-packages]
    name: Install smoke ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-2025-vs2026
            target: x86_64-pc-windows-msvc
            compiler: cl
            windows: true
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-musl
            compiler: gcc
            windows: false
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
            compiler: gcc
            windows: false
          - runner: macos-15-intel
            target: x86_64-apple-darwin
            compiler: clang
            windows: false
          - runner: macos-15
            target: aarch64-apple-darwin
            compiler: clang
            windows: false
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Download target archive
        uses: actions/download-artifact@v5
        with:
          name: release-${{ matrix.target }}
          path: dist

      - name: Generate checksum manifest
        run: >-
          python scripts/release/package_release.py checksums
          --dist-dir dist
          --output dist/SHA256SUMS

      - name: Enable MSVC developer environment
        if: matrix.windows
        uses: ilammy/msvc-dev-cmd@v1

      - name: Run Windows installation smoke
        if: matrix.windows
        shell: pwsh
        run: |
          $archive = Get-ChildItem -LiteralPath dist -Filter "*.zip" | Select-Object -First 1
          if (-not $archive) { throw "Release archive was not downloaded." }
          ./scripts/release/test_install_windows.ps1 `
            -ArchivePath $archive.FullName `
            -ChecksumPath (Resolve-Path "dist/SHA256SUMS").Path `
            -ExpectedVersion '${{ needs.validate.outputs.version }}' `
            -Compiler '${{ matrix.compiler }}'

      - name: Run POSIX installation smoke
        if: ${{ !matrix.windows }}
        shell: bash
        run: |
          archive=""
          for candidate in dist/*.tar.gz; do
            if [[ -f "$candidate" ]]; then
              archive="$candidate"
              break
            fi
          done
          test -n "$archive"
          ./scripts/release/test_install_unix.sh \
            --archive "$archive" \
            --checksum-file dist/SHA256SUMS \
            --version '${{ needs.validate.outputs.version }}' \
            --cc '${{ matrix.compiler }}'

  assemble:
    needs: [validate, distribution-smoke]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Download all target archives
        uses: actions/download-artifact@v5
        with:
          pattern: release-*
          path: dist
          merge-multiple: true

      - name: Generate final checksum manifest
        run: >-
          python scripts/release/package_release.py checksums
          --dist-dir dist
          --output dist/SHA256SUMS

      - name: Add installer scripts
        shell: bash
        run: cp install/install.ps1 install/uninstall.ps1 install/install.sh install/uninstall.sh dist/

      - name: Verify release payload
        shell: bash
        run: |
          test "$(find dist -maxdepth 1 -type f \( -name '*.zip' -o -name '*.tar.gz' \) | wc -l)" -eq 5
          (cd dist && sha256sum --check SHA256SUMS)

      - name: Upload complete release candidate
        uses: actions/upload-artifact@v4
        with:
          name: skadi-cli-v${{ needs.validate.outputs.version }}
          path: dist/*
          if-no-files-found: error
          retention-days: 30

      - name: Create draft GitHub prerelease
        if: github.event_name == 'push' || inputs.publish == true
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.validate.outputs.version }}
        shell: bash
        run: |
          gh release create "v$VERSION" dist/* \
            --verify-tag \
            --draft \
            --prerelease \
            --title "Skadi v$VERSION" \
            --notes-file CHANGELOG.md
